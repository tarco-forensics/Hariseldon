<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T2SAIM — Arbitraj & Value Bet Analizörü</title>
    <style>
        :root { --bg:#06080c; --card:#0d1118; --gold:#c9a84c; --green:#10b981; --red:#ef4444; }
        *{box-sizing:border-box; margin:0; padding:0;}
        body{font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:#d1d5db; padding:1rem; min-height:100vh;}
        .glass{background:var(--card); border:1px solid rgba(255,255,255,0.04); border-radius:12px; padding:1.5rem;}
        h2{color:var(--gold); font-size:1.1rem; margin-bottom:1rem;}
        input,button{padding:10px 14px; border-radius:8px; border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.05); color:white; font-size:0.9rem; outline:none; width:100%;}
        input:focus{border-color:var(--gold);}
        button{background:var(--gold); color:var(--bg); font-weight:700; cursor:pointer; border:none;}
        .grid{display:grid; gap:1rem;}
        .grid-2{grid-template-columns:1fr 1fr;}
        .grid-3{grid-template-columns:1fr 1fr 1fr;}
        .stat{text-align:center; padding:10px; border-radius:8px; background:rgba(255,255,255,0.03);}
        .stat-val{font-size:1.4rem; font-weight:700;}
        .pos{color:var(--green)} .neg{color:var(--red)}
    </style>
</head>
<body style="max-width:900px; margin:0 auto;">
    
    <div class="glass" style="border-left:4px solid var(--gold); margin-bottom:1rem;">
        <h1 style="color:white; font-size:1.4rem;">🧠 T2SAIM Arbitraj & Value Bet</h1>
        <p style="color:#6b7280; font-size:0.8rem;">Overround hesapla • Arbitraj tespit et • Edge bul</p>
    </div>

    <!-- ORAN GIRISI -->
    <div class="glass" style="margin-bottom:1rem;">
        <h2>⚽ Maç Oranları Girin (1-X-2)</h2>
        <div class="grid grid-3" style="margin-bottom:0.8rem;">
            <div><label style="font-size:0.75rem; color:#9ca3af;">Ev Sahibi (1)</label><input id="o1" value="1.85" step="0.01" type="number"></div>
            <div><label style="font-size:0.75rem; color:#9ca3af;">Beraberlik (X)</label><input id="oX" value="3.40" step="0.01" type="number"></div>
            <div><label style="font-size:0.75rem; color:#9ca3af;">Deplasman (2)</label><input id="o2" value="4.50" step="0.01" type="number"></div>
        </div>
        <div class="grid grid-2" style="margin-top:0.5rem;">
            <div><label style="font-size:0.75rem; color:#9ca3af;">Kasa (₺)</label><input id="kasa" value="1000" step="100" type="number"></div>
            <button onclick="hesapla()">🔍 Hesapla</button>
        </div>
    </div>

    <!-- SONUCLAR -->
    <div class="glass" style="margin-bottom:1rem;" id="sonucDiv">
        <h2>📊 Analiz Sonucu</h2>
        <div class="grid grid-3" style="margin-bottom:1rem;">
            <div class="stat"><span style="color:#9ca3af; font-size:0.7rem;">Overround (Marj)</span><p class="stat-val" id="overround" style="color:var(--gold);">—</p></div>
            <div class="stat"><span style="color:#9ca3af; font-size:0.7rem;">Arbitraj Kârı</span><p class="stat-val" id="arbKar">—</p></div>
            <div class="stat"><span style="color:#9ca3af; font-size:0.7rem;">Value Bet Edge</span><p class="stat-val" id="valEdge">—</p></div>
        </div>
        
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-top:0.5rem;">
            <div style="padding:12px; background:rgba(255,255,255,0.02); border-radius:8px;">
                <h3 style="color:var(--gold); font-size:0.85rem; margin-bottom:0.5rem;">Fair Odds</h3>
                <p style="font-size:0.8rem;" id="fairOranlar">—</p>
            </div>
            <div style="padding:12px; background:rgba(255,255,255,0.02); border-radius:8px;">
                <h3 style="color:var(--gold); font-size:0.85rem; margin-bottom:0.5rem;">Optimal Stake (₺)</h3>
                <p style="font-size:0.8rem;" id="stake">—</p>
            </div>
        </div>
        
        <div style="margin-top:1rem; padding:0.8rem; border-radius:8px; text-align:center; font-weight:700;" id="karar">
            ⏳ Oranları girin ve hesaplayın
        </div>
    </div>

    <!-- HIZLI TESTLER -->
    <div class="glass">
        <h2>🧪 Hızlı Test Maçları</h2>
        <div class="grid grid-2" style="font-size:0.8rem;">
            <button onclick="test(0)" style="background:rgba(255,255,255,0.05); color:white; border:1px solid rgba(255,255,255,0.1);">Man City vs Arsenal (2.10, 3.40, 3.80)</button>
            <button onclick="test(1)" style="background:rgba(255,255,255,0.05); color:white; border:1px solid rgba(255,255,255,0.1);">Arbitraj Örneği (2.50, 3.00, 5.50)</button>
            <button onclick="test(2)" style="background:rgba(255,255,255,0.05); color:white; border:1px solid rgba(255,255,255,0.1);">GS vs FB (1.90, 3.20, 4.20)</button>
            <button onclick="test(3)" style="background:rgba(255,255,255,0.05); color:white; border:1px solid rgba(255,255,255,0.1);">Liverpool vs Chelsea (1.75, 3.60, 4.80)</button>
        </div>
    </div>

<script>
const testler = [
    [2.10,3.40,3.80], [2.50,3.00,5.50], [1.90,3.20,4.20], [1.75,3.60,4.80]
];

function test(i){
    document.getElementById('o1').value = testler[i][0];
    document.getElementById('oX').value = testler[i][1];
    document.getElementById('o2').value = testler[i][2];
    hesapla();
}

function hesapla(){
    const o1=+document.getElementById('o1').value;
    const oX=+document.getElementById('oX').value;
    const o2=+document.getElementById('o2').value;
    const kasa=+document.getElementById('kasa').value;
    
    // Implied probability
    const imp=1/o1+1/oX+1/o2;
    const overround=((imp-1)*100).toFixed(1);
    
    // Fair odds
    const f1=(1/o1)/imp*100, fX=(1/oX)/imp*100, f2=(1/o2)/imp*100;
    
    // Arbitraj
    const arbVar=imp<0.98;
    const arbKar=arbVar?((1-imp)*100).toFixed(2):'0';
    
    // Value bet (basit)
    const evOlasilik=0.42;
    const evEdge=((evOlasilik*(o1-1))-(1-evOlasilik))*100;
    const valVar=evEdge>5;
    
    // Stake (arbitraj varsa)
    let stakeText='Arbitraj yok';
    if(arbVar){
        const s1=(kasa/o1/imp).toFixed(0);
        const sX=(kasa/oX/imp).toFixed(0);
        const s2=(kasa/o2/imp).toFixed(0);
        stakeText=`1: ${s1}₺ | X: ${sX}₺ | 2: ${s2}₺`;
    }
    
    // Karar
    let karar='⛔ Bekle';
    if(arbVar) karar='✅ ARBİTRAJ FIRSATI! Garantili kâr: %'+arbKar;
    else if(valVar) karar='🟢 VALUE BET! Edge: %'+evEdge.toFixed(1);
    else if(+overround<5) karar='🟡 Düşük marj, takip et';
    else karar='🔴 Yüksek marj, girilmez';
    
    document.getElementById('overround').textContent='%'+overround;
    document.getElementById('arbKar').innerHTML='<span class="'+(arbVar?'pos':'neg')+'">%'+arbKar+(arbVar?' ✅':'')+'</span>';
    document.getElementById('valEdge').innerHTML='<span class="'+(valVar?'pos':'neg')+'">%'+evEdge.toFixed(1)+(valVar?' ✅':'')+'</span>';
    document.getElementById('fairOranlar').textContent=`1: %${f1.toFixed(1)} | X: %${fX.toFixed(1)} | 2: %${f2.toFixed(1)}`;
    document.getElementById('stake').textContent=stakeText;
    
    const kararDiv=document.getElementById('karar');
    kararDiv.textContent=karar;
    kararDiv.style.background=arbVar?'rgba(16,185,129,0.15)':(valVar?'rgba(16,185,129,0.1)':(+overround<5?'rgba(245,158,11,0.1)':'rgba(239,68,68,0.1)'));
    kararDiv.style.color=arbVar?'#10b981':(valVar?'#10b981':(+overround<5?'#f59e0b':'#ef4444'));
}

hesapla(); // Ilk yuklemede calistir
</script>
</body>
</html>
